<body>
<div class="main">
<h1>Tables</h1>
<table style="width:100%">
  <tr>
    <th>Tags</th>
    <th> Definition</th>
    <th>Examples</th>
  </tr>
  <tr>
    <td> < title >< / title ></td>
    <td> Title of document that appears on the browser tab </td>
    <td> See browser title above ("Assignment 3")</td>
  </tr>     
  <tr>
    <td>< h1 >< h1 ></td>
    <td> Heading </td>
    <td> <h1>This is a Heading</h1></td>
  </tr>
  <tr>
    <td>< b >< b ></td>
    <td> Defines Bold Text </td>
    <td> <b>BOLD</b> </td>
  </tr>
  <tr>
    <td>< body >< body ></td>
    <td> Defines Documents Body </td>
    <td> <body>Body</body> </td>
  </tr>
  <tr>
    <td>< p >< p ></td>
    <td> Defines a paragraph </td>
    <td> <b>BOLD</b> </td>
  </tr>
</table>
</div>
</body>
