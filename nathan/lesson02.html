<title> Lesson 02: Images and Hyperlink</title>

<body>
<h1>Hyperlinks</h1>
<p> The website that we will be using as an online textbook can be found on: 
<a href="https://www.w3schools.com/html/" target="_blank">w3schools.com</a>.</p>
<!--target="_blank" will open a new tab.-->

<h1>Images</h1>
<p>The three major types of web-friendly images are:
(1) jpg (photos), (2) gif (animations), (3) png (graphics that may include transperancy).
</p>
<p>
<h2>External Source</h2>
<img style="width:200px;" alt="pizza" src="https://www.simplyrecipes.com/wp-content/uploads/2019/09/easy-pepperoni-pizza-lead-4-600x840.jpg">
<!--src: source,
alt: alternative name in case browser can't load image
style=width;50px (not 50 px), also use 50em, 50%-->
<h2>Internal Source</h2>
<!--
1. You must save your internal source in the SAME folder as this file.
-->
<img style="width:200px;transform:rotate(270deg)" alt="Mr. Trololo" src="hqdefault.jpg">
</body>
</html>
